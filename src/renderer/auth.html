<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
<title>Sign in</title>
<style>
  body { margin:0; padding:18px 22px; background:#2b2d31; color:#ddd; font:13px system-ui, sans-serif; }
  h2 { margin:0 0 4px; font-size:15px; }
  p { margin:0 0 12px; color:#aaa; word-break:break-all; }
  label { display:block; margin:8px 0; }
  input { display:block; width:100%; margin-top:4px; padding:6px 8px; background:#1e1f22; color:#ddd; border:1px solid #444; border-radius:6px; box-sizing:border-box; }
  menu { display:flex; justify-content:flex-end; gap:8px; margin:14px 0 0; padding:0; }
  button { padding:6px 14px; border-radius:6px; border:none; background:#4c8bf5; color:#fff; cursor:pointer; }
  button.cancel { background:#444; }
</style>
</head>
<body>
<h2>Authentication required</h2>
<p id="host"></p>
<form id="f">
  <label>Username <input name="username" autocomplete="username" autofocus placeholder="DOMAIN\user or user@domain" /></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" /></label>
  <label id="remember-row" style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="remember" checked style="display:inline;width:auto;margin:0" /> Remember password (stored in the system keyring)</label>
  <menu>
    <button type="button" class="cancel" id="cancel">Cancel</button>
    <button type="submit">Sign in</button>
  </menu>
</form>
<script type="module" src="./auth.ts"></script>
</body>
</html>
